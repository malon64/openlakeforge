name: Local full e2e (nightly and manual)

# Fresh local end-to-end validation, nightly on the default branch and on
# demand for any branch.
#
# Issue #60 scoped the full local e2e suite as a main/nightly gate. The
# schedule below is that gate; the dispatch trigger additionally lets a
# maintainer select any branch in the UI and verify its runtime conformance
# from GitHub Actions instead of a local machine.
#
# The job runs the supported `olf` lifecycle and e2e commands directly.
#
# It reuses the kind-smoke plumbing from checks.yml (same managed-toolchain
# provisioning and `olf diagnostics collect` on failure) but
# deploys the full profile by default and runs the complete assertion suite:
# Polaris namespaces, Dagster product pipelines, Silver and Gold tables,
# Polaris restart recovery, Superset dashboards, OpenMetadata assets, and
# ops-bucket artifacts -- discovered dynamically from the domain inventory.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: >
          Suite to run. 'full' deploys the full profile (governance and
          analytics enabled) and runs every product pipeline and assertion.
          'smoke' deploys the slim profile and validates one product pipeline
          through a queryable Gold table.
        type: choice
        options:
          - full
          - smoke
        default: full
      timeout_minutes:
        description: >
          Hard wall-clock budget for the whole job. The full profile builds the
          project-code and Superset images and deploys OpenMetadata, so 120
          minutes is the default; raise it if the run needs more.
        type: number
        default: 120
      debug_fail_after_deploy:
        description: >
          Negative test: fail the job right after the platform is deployed to
          prove the failure diagnostics and artifact retention work on a broken
          deployment. Defaults to false.
        type: boolean
        default: false
  schedule:
    # 02:00 UTC nightly against the default branch. `checks.yml`'s kind-smoke
    # covers one product per pull request; this is the only scheduled run of
    # the full assertion suite, so a runtime regression that static checks
    # cannot see is dated to a single day of merges instead of surfacing at
    # release time. Every `inputs.*` below is null on this trigger and falls
    # back to its dispatch default.
    - cron: "0 2 * * *"

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One run per branch at a time; a new dispatch or nightly trigger waits for
  # the previous one instead of cancelling it, so a branch's result is never
  # ambiguous.
  group: local-full-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  CLUSTER_NAME: openlakeforge-e2e-${{ github.run_id }}
  KUBE_CONTEXT: kind-openlakeforge-e2e-${{ github.run_id }}
  LOCAL_KUBECONFIG_PATH: ${{ github.workspace }}/.tmp/kubeconfigs/local-e2e.yaml
  KUBECONFIG: ${{ github.workspace }}/.tmp/kubeconfigs/local-e2e.yaml
  PROJECT_CODE_IMAGE_TAG: local

jobs:
  e2e:
    name: Deploy and validate local stack (${{ inputs.suite || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || 120) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081

      - name: Cache OpenLakeForge toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.openlakeforge
          key: olf-toolchain-${{ hashFiles('release/component-catalog.yaml') }}

      - name: Provision OpenLakeForge toolchain
        run: uv run --project tools/olf --locked olf toolchain install

      - name: Deploy the local stack (fresh foundation)
        run: uv run --project tools/olf --locked olf deploy --provider local --profile ${{ inputs.suite == 'smoke' && 'slim' || 'full' }} --cluster-name ${{ env.CLUSTER_NAME }} --kubeconfig-path ${{ env.LOCAL_KUBECONFIG_PATH }}

      - name: Negative-test failure injection
        if: inputs.debug_fail_after_deploy == 'true'
        run: |
          echo "::error::debug_fail_after_deploy was set -- failing after deploy" \
            "to prove diagnostics retention on a broken deployment."
          exit 1

      - name: Run the local e2e suite
        run: uv run --project tools/olf --locked olf e2e run --env local --suite ${{ inputs.suite || 'full' }}

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Local ${{ inputs.suite || 'full' }} e2e -- ${{ job.status }}"
            echo ""
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Comment the result on the branch's pull request
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_number="$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty')"
          if [[ -n "${pr_number}" ]]; then
            gh pr comment "${pr_number}" --body \
              "Local ${{ inputs.suite || 'full' }} e2e run finished with status **${{ job.status }}** ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))"
          fi

      - name: Collect kind diagnostics
        if: failure()
        run: uv run --project tools/olf --locked olf diagnostics collect .tmp/kind-e2e-diagnostics

      - name: Upload kind diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kind-e2e-diagnostics-${{ github.run_id }}
          path: .tmp/kind-e2e-diagnostics
          if-no-files-found: error
          retention-days: 14
