apiVersion: openlakeforge.io/v1alpha2
kind: Domain
name: sales
displayName: Sales
description: Sales domain fixture leaking a physical catalog identity.
status: active
data_products:
  - id: order_revenue
    name: order_revenue
    displayName: Order Revenue
    description: Revenue per order.
    status: active
    asset_prefix: order_revenue
    bronze:
      - name: orders
        path: orders/*.csv
    silver_tables:
      tables:
        - name: orders
          fqn: polaris.lakehouse_dev.sales_order_revenue_silver.orders
    gold_tables:
      tables:
        - name: order_revenue_daily
