apiVersion: openlakeforge.io/v1alpha3
kind: Lakehouse
name: openlakeforge
displayName: OpenLakeForge
description: Fixture lakehouse leaking a provider-coupled field at the root.
status: planned
catalog: polaris
sources:
  - crm
domains:
  - name: sales
    displayName: Sales
    description: Sales domain fixture.
    status: planned
    silver_tables:
      tables:
        - name: orders
          source: crm
          resource: orders
    products:
      - id: order_revenue
        displayName: Order Revenue
        description: Revenue per order.
        status: planned
        silver_inputs: [orders]
        gold_tables:
          tables:
            - name: order_revenue_daily
dashboards:
  - name: sales_order_revenue
    products: [order_revenue]
