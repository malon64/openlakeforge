apiVersion: openlakeforge.io/v1alpha3
kind: Lakehouse
name: openlakeforge
displayName: OpenLakeForge
description: Fixture lakehouse leaking a physical catalog identity.
status: planned
sources:
  - crm
domains:
  - name: sales
    displayName: Sales
    description: Sales domain fixture.
    status: planned
    products:
      - id: order_revenue
        displayName: Order Revenue
        description: Revenue per order.
        status: planned
        bronze:
          source: crm
          resources:
            - orders
        silver_tables:
          tables:
            - name: orders
              fqn: polaris.lakehouse_dev.sales_silver.orders
        gold_tables:
          tables:
            - name: order_revenue_daily
dashboards:
  - name: sales_order_revenue
    product: order_revenue