version: "0.2"

metadata:
  project: "openlakeforge"
  owner: "sales"
  description: "Sales Bronze to Silver Floe contracts."
  tags: ["sales", "silver"]

storages:
  default: "lakehouse_bronze"
  definitions:
    - name: "lakehouse_bronze"
      type: "s3"
      bucket: "{{OPENLAKEFORGE_STORAGE_BRONZE_BUCKET}}"
      region: "{{OPENLAKEFORGE_STORAGE_REGION}}"
    - name: "lakehouse_silver"
      type: "s3"
      bucket: "{{OPENLAKEFORGE_STORAGE_SILVER_BUCKET}}"
      region: "{{OPENLAKEFORGE_STORAGE_REGION}}"
    - name: "openlakeforge_ops"
      type: "s3"
      bucket: "{{OPENLAKEFORGE_OPS_BUCKET_NAME}}"
      region: "{{OPENLAKEFORGE_STORAGE_REGION}}"

report:
  path: "floe/reports/sales"
  storage: "openlakeforge_ops"

entities:
  - name: "orders"
    incremental_mode: "none"
    source:
      format: "csv"
      path: "crm/orders"
      storage: "lakehouse_bronze"
      options: { header: true, separator: ",", encoding: "utf-8", glob: "*.csv" }
      cast_mode: "strict"
    sink:
      write_mode: "overwrite"
      accepted:
        format: "iceberg"
        path: "sales/orders"
        storage: "lakehouse_silver"
        iceberg: { catalog: "iceberg_catalog", namespace: "sales_silver", table: "orders" }
      rejected: { format: "csv", path: "floe/rejected/sales/orders", storage: "lakehouse_silver" }
    policy: { severity: "reject" }
    schema:
      normalize_columns: { enabled: true, strategy: "snake_case" }
      primary_key: ["order_id"]
      columns:
        - { name: "order_id", type: "string", nullable: false }
        - { name: "customer_id", type: "string", nullable: false }
        - { name: "order_date", type: "date", nullable: false }
        - { name: "channel_id", type: "string", nullable: false }
        - { name: "promotion_id", type: "string", nullable: false }
        - { name: "region", type: "string", nullable: false }
        - { name: "status", type: "string", nullable: false }

  - name: "order_lines"
    incremental_mode: "none"
    source:
      format: "csv"
      path: "crm/order_lines"
      storage: "lakehouse_bronze"
      options: { header: true, separator: ",", encoding: "utf-8", glob: "*.csv" }
      cast_mode: "strict"
    sink:
      write_mode: "overwrite"
      accepted:
        format: "iceberg"
        path: "sales/order_lines"
        storage: "lakehouse_silver"
        iceberg: { catalog: "iceberg_catalog", namespace: "sales_silver", table: "order_lines" }
      rejected: { format: "csv", path: "floe/rejected/sales/order_lines", storage: "lakehouse_silver" }
    policy: { severity: "reject" }
    schema:
      normalize_columns: { enabled: true, strategy: "snake_case" }
      primary_key: ["line_id"]
      columns:
        - { name: "line_id", type: "string", nullable: false }
        - { name: "order_id", type: "string", nullable: false }
        - { name: "product_id", type: "string", nullable: false }
        - { name: "quantity", type: "integer", nullable: false }
        - { name: "unit_price", type: "number", nullable: false }
        - { name: "discount_amount", type: "number", nullable: false }

  - name: "products"
